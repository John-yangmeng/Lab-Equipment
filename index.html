<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Equipment Introduction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans‑serif;
        }
        body {
            padding: 24px;
            background-color: #ffffff;
            color: #222222;
            font-size: 18px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #111111;
        }
        .block {
            margin: 14px 0;
        }
        .label {
            font-weight: bold;
            margin-bottom: 4px;
            color: #333333;
        }
        .tip {
            margin-top: 30px;
            padding: 12px 16px;
            border-radius: 8px;
            background-color: #f5f7fa;
            color: #555555;
            font-size: 15px;
        }
        .play-btn{
            margin-top:20px;
            padding:12px 24px;
            font-size:17px;
            background:#2b65d9;
            color:#fff;
            border:none;
            border-radius:8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="content"></div>
        <button class="play-btn" id="playBtn">Play Voice 播放语音</button>
        <div class="tip">Click button for equipment voice introduction.<br>点击按钮播放设备语音介绍</div>
        <audio id="audioPlayer" preload="auto">
    </div>

<script>
const deviceData={
"EQ01":{
"name":"EQ01 Air‑change aging ovens",
"func":"Thermal aging test, evaluate heat resistance and service life of materials.",
"app":"Insulation resin, impregnating varnish, magnet wire, cable, rubber parts."
},
"EQ02":{
"name":"EQ02 Muffle furnaces",
"func":"High‑temperature ashing and incineration to detect organic content in fillers.",
"app":"Insulation materials, coatings, polymer composites, resin fillers."
},
"EQ03":{
"name":"EQ03 Temp Impact Chamber",
"func":"Simulate sudden temperature change and test thermal shock resistance.",
"app":"Insulation parts, plastic parts, magnet wire, adhesives."
},
"EQ04":{
"name":"EQ04 Temp & Humidity Alt. Chamber",
"func":"Temperature and humidity cycle test to verify performance under humid and hot conditions.",
"app":"Coils, insulation paper, connectors, insulation materials."
},
"EQ05":{
"name":"EQ05 Condensed Water Test Chamber",
"func":"Simulate condensation environment and carry out thermal cycle resistance and water aging tests.",
"app":"Insulation materials, magnet wire, plastic parts, motor components."
},
"EQ06":{
"name":"EQ06 Salt Spray Chamber",
"func":"Simulate marine climate and conduct neutral or acid salt spray corrosion tests.",
"app":"Motor components, coatings, metal parts, insulation materials."
},
"EQ07":{
"name":"EQ07 UV Aging Chamber",
"func":"Simulate ultraviolet irradiation and test weather resistance of materials.",
"app":"Insulation materials, plastic parts, coatings, rubber parts."
},
"EQ08":{
"name":"EQ08 Pure Water System",
"func":"Produce laboratory water meeting relevant standards.",
"app":"Chemical analysis, laboratory tests, equipment cleaning."
},
"EQ09":{
"name":"EQ09 Vickers Hardness Tester",
"func":"Measure hardness of materials.",
"app":"Metal parts, coatings, heat‑treated components."
},
"EQ10":{
"name":"EQ10 Metallographic Microscope",
"func":"Observe microstructure of materials.",
"app":"Metal materials, failure analysis, coating thickness inspection."
},
"EQ11":{
"name":"EQ11 FTIR Spectrometer",
"func":"Analyze chemical structure and identify material composition.",
"app":"Polymers, resins, rubber, coatings."
},
"EQ12":{
"name":"EQ12 DSC",
"func":"Test thermal properties of materials such as glass transition temperature.",
"app":"Polymer materials, resin curing degree, melting point test."
},
"EQ13":{
"name":"EQ13 TGA",
"func":"Test thermal decomposition temperature and thermal stability of materials.",
"app":"Insulation materials, polymers, composite materials."
},
"EQ14":{
"name":"EQ14 Rheometer",
"func":"Measure flow and deformation characteristics of materials.",
"app":"Resins, coatings, adhesives, plastics."
},
"EQ15":{
"name":"EQ15 Refractometer",
"func":"Measure refractive index of liquid samples.",
"app":"Solution concentration detection, oil products, chemical raw material inspection."
},
"EQ16":{
"name":"EQ16 Fume hood",
"func":"Provide safe operating environment and exhaust harmful gas.",
"app":"Chemical experiments, sample pretreatment, solvent operation."
},
"EQ17":{
"name":"EQ17 Constant Temperature Oil Bath",
"func":"Provide constant temperature heating environment.",
"app":"Sample heating, reactor heating, distillation test."
},
"EQ18":{
"name":"EQ18 Tracking Index tester",
"func":"Test tracking resistance of insulation materials.",
"app":"Insulation materials, plastic parts, electrical equipment components."
},
"EQ19":{
"name":"EQ19 20kN tensile tester",
"func":"Test tensile, compression, bending and other mechanical properties.",
"app":"Metal materials, plastics, rubber, composite materials."
},
"EQ20":{
"name":"EQ20 5kN tensile tester",
"func":"Test tensile, compression, bending and other mechanical properties.",
"app":"Metal materials, plastics, rubber, composite materials."
},
"EQ21":{
"name":"EQ21 5kN High Temp & Humidity Tester",
"func":"Test mechanical properties under high temperature and high humidity environment.",
"app":"Insulation materials, plastics, rubber, composite materials."
},
"EQ22":{
"name":"EQ22 Breakdown Voltage Tester",
"func":"Test electrical insulation strength of materials.",
"app":"Insulation materials, cables, motor windings, transformers."
},
"EQ23":{
"name":"EQ23 Electronic Balance",
"func":"High‑precision weighing.",
"app":"Sample weighing, formulation preparation, quality control."
},
"EQ24":{
"name":"EQ24 Controlled Sample Cabinet",
"func":"Provide constant temperature and humidity environment for sample storage.",
"app":"Sample storage, material stability test."
},
"EQ25":{
"name":"EQ25 Chemical cabinet",
"func":"Safe storage of chemical reagents.",
"app":"Laboratory chemical management."
},
"EQ26":{
"name":"EQ26 Temp & Humidity Test Chamber",
"func":"Simulate temperature and humidity environment to test material performance.",
"app":"Electronic components, plastics, metals, composite materials."
},
"EQ27":{
"name":"EQ27 Metallographic Sample Preparation Equipment",
"func":"Metallographic specimen preparation.",
"app":"Specimen cutting, mounting, grinding and polishing."
},
"EQ28":{
"name":"EQ28 Bolt & Nut Tester",
"func":"Test mechanical properties of bolts and nuts.",
"app":"Fasteners, connecting parts, structural components."
}
};

function getQueryParam(name){
    const params=new URLSearchParams(window.location.search);
    return params.get(name);
}
const id=getQueryParam("id");
const contentDiv=document.getElementById("content");
const audioPlayer=document.getElementById("audioPlayer");
const playBtn=document.getElementById("playBtn");

if(deviceData[id]){
    const d=deviceData[id];
    contentDiv.innerHTML=`<h1>${d.name}</h1>
    <div class="block">
        <div class="label">Function</div>
        <div>${d.func}</div>
    </div>
    <div class="block">
        <div class="label">Application</div>
        <div>${d.app}</div>
    </div>`;
    audioPlayer.src = `${id}.mp3`;
}else{
    contentDiv.innerHTML="<h1>Unknown Equipment</h1><p>Invalid QR code parameter.</p>";
    playBtn.style.display="none";
}

playBtn.addEventListener("click",()=>{
    audioPlayer.pause();
    audioPlayer.currentTime=0;
    audioPlayer.play();
})
</script>
</body>
