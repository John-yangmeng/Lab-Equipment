<style>

body{padding:24px;background:#ffffff;color:#222;font-size:18px;line-height:1.6}
.container{max-width:600px;margin:0 auto}
h1{font-size:24px;margin-bottom:16px;color:#111}
.block{margin:14px 0}
.label{font-weight:bold;margin-bottom:4px;color:#444}
.tip{margin-top:30px;color:#666;font-size:15px;border:1px solid #ccc;padding:12px;border-radius:8px}
</style>
</head>
<body>
<div class="container">

</div>

function getQueryParam(name){
const params=new URLSearchParams(window.location.search);
return params.get(name);
}
const id=getQueryParam("id");
const contentDiv=document.getElementById("content");
let speechText="";
if(deviceData[id]){
const d=deviceData[id];
contentDiv.innerHTML=`<h1>${d.name}</h1><div class="block"><div class="label">Function</div><div>${d.func}</div></div><div class="block"><div class="label">Application</div><div>${d.app}</div></div>`;
speechText=d.speechText;
}else{
contentDiv.innerHTML="<h1>Unknown Equipment</h1><p>Invalid QR code parameter.</p>";
}

document.body.addEventListener("click",()=>{
if(!speechText) return;
window.speechSynthesis.cancel();
let utter=new SpeechSynthesisUtterance(speechText);
utter.lang="en‑US";
utter.rate=0.95;
window.speechSynthesis.speak(utter);
})
</script>

</html>
